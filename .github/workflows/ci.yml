# Checks every pull request, and runs before each deploy (deploy.yml calls this workflow), so a
# broken commit never reaches the installed app.
name: CI

on:
  pull_request:
  workflow_call:

# Read-only token: CI only reads the repository.
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    # A full run takes a few minutes; don't let a hung server or browser hold the deploy queue.
    timeout-minutes: 20
    # A new push to a PR cancels its older run. Runs called by deploy.yml (no PR) never share a
    # group, so a deploy's checks are never cancelled.
    concurrency:
      group: ci-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: true
    steps:
      # Full history: the changelog build numbers entries by the commit that added them.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # A PR's checkout is GitHub's merge commit, so HEAD^1 is the base branch it merges into.
      - name: Changelog entries are never renamed
        if: github.event_name == 'pull_request'
        run: |
          renamed=$(git diff --find-renames --name-status --diff-filter=R HEAD^1 HEAD -- changelog/)
          if [ -n "$renamed" ]; then
            echo "::error::Don't rename changelog entries (the entry would show as new again):"
            echo "$renamed"
            exit 1
          fi

      - name: Install pnpm
        # The version comes from `packageManager` in package.json.
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm check

      - name: Lint
        run: pnpm lint

      - name: Install Playwright's Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Unit tests
        run: pnpm test:unit --run

      - name: End-to-end tests
        run: pnpm test:e2e

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
