# Checks every pull request, and runs before each deploy (deploy.yml calls this workflow), so a
# broken commit never reaches the installed app.
name: CI

on:
  pull_request:
  workflow_call:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm check

      - name: Lint
        run: pnpm lint

      - name: Install Playwright's Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Unit tests
        run: pnpm test:unit --run

      - name: End-to-end tests
        run: pnpm test:e2e

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
