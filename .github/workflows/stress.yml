# Temporary (#91): runs the e2e suite many times per variant to measure how often Chromium
# crashes, and with which change it stops. Removed before the fix is merged.
name: Stress e2e (#91)

on:
  pull_request:

jobs:
  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline, sw-block, workers1]
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: End-to-end tests × 20
        continue-on-error: true
        env:
          PW_SERVICE_WORKERS: ${{ matrix.variant == 'sw-block' && 'block' || 'allow' }}
          PW_WORKERS: ${{ matrix.variant == 'workers1' && '1' || '' }}
          PLAYWRIGHT_JSON_OUTPUT_NAME: results.json
        run: pnpm exec playwright test --repeat-each 20 --reporter=list,json
      - name: Summarize crashes
        if: always()
        run: node scripts/stress-analyze.mjs results.json "${{ matrix.variant }} #${{ matrix.shard }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stress-${{ matrix.variant }}-${{ matrix.shard }}
          path: results.json
          retention-days: 7
