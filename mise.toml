# Node's version comes from .tool-versions (which mise reads, and CI uses), so there's one place
# to change it.

[hooks]
# Corepack installs the pnpm version `packageManager` names in package.json.
postinstall = 'npx corepack enable'

[settings]
# This must be enabled to make the hooks work
experimental = true

[env]
_.path = ['{{config_root}}/node_modules/.bin']

[tasks.pnpm-install]
description = 'Installs dependencies with pnpm'
run = 'pnpm install'
sources = ['package.json', 'pnpm-lock.yaml', 'mise.toml']
outputs = ['node_modules/.pnpm/lock.yaml']

[tasks.dev]
description = 'Calls your dev script in `package.json`'
usage = '''
flag "-x --host" help="Expose on network" default=#false
'''
run = "node --run dev {% if usage.host %}-- --host{%endif%}"
depends = ['pnpm-install']
