<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		%sveltekit.head%
		<!-- The manifest, icons and the pre-paint script (theme and navigation style, so dark mode
		     doesn't flash light and the layout doesn't jump), after the head SvelteKit renders so
		     its Content Security Policy applies. -->
		%xcwds.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
